<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">SOE solid O with notch direction</title>
  <desc id="desc">SOE wordmark with a mostly closed typographic O and a single notch to imply controlled openness.</desc>
  <rect width="900" height="520" fill="#f4efe5"/>
  <g fill="#07111f">
    <text x="62" y="250" font-family="Inter, Arial, sans-serif" font-size="220" font-weight="750" letter-spacing="-12">S</text>
    <text x="594" y="250" font-family="Inter, Arial, sans-serif" font-size="220" font-weight="750" letter-spacing="-8">E</text>
  </g>
  <g transform="translate(450 173)">
    <circle cx="0" cy="0" r="94" fill="#07111f"/>
    <circle cx="0" cy="0" r="59" fill="#f4efe5"/>
    <path d="M 42 -100 L 112 -76 L 70 -45 Z" fill="#f4efe5"/>
  </g>
  <g stroke="#07111f" stroke-width="6" stroke-linecap="square">
    <line x1="110" y1="360" x2="388" y2="360"/>
    <line x1="512" y1="360" x2="790" y2="360"/>
  </g>
  <circle cx="450" cy="360" r="14" fill="#07111f"/>
</svg>

